!DOCTYPE html>
<html lang="en"<>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌡️ Temperature Converter</h1>
        <p class="subtitle">Convert temperature between Celsius, Fahrenheit and Kelvin</p>

        <div class="form-group">
            <label for="temperature">Enter Temperature</label>
            <input 
                type="number" 
                id="temperature" 
                placeholder="Enter temperature"
                step="any"
            >
        </div>

        <div class="form-group">
            <label for="unit">Select Input Unit</label>

            <select id="unit">
                <option value="Celsius">Celsius (°C)</option>
                <option value="Fahrenheit">Fahrenheit (°F)</option>
                <option value="Kelvin">Kelvin (K)</option>
            </select>
        </div>

        <button onclick="convertTemperature()">Convert Temperature</button>

        <p id="error"></p>

        <div class="results">

            <h2>Conversion Results</h2>

            <div class="result-box">
                <span>Celsius</span>
                <strong id="celsius">-- °C</strong>
            </div>

            <div class="result-box">
                <span>Fahrenheit</span>
                <strong id="fahrenheit">-- °F</strong>
            </div>

            <div class="result-box">
                <span>Kelvin</span>
                <strong id="kelvin">-- K</strong>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
